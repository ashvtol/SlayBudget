[package]
name = "slaybudget-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SlayBudget business logic: SQLite storage, import, categorization, analytics"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "session"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
csv = "1"

[dev-dependencies]
tempfile = "3"
