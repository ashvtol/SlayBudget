name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run from the Actions tab: builds every platform and keeps the installers as workflow artifacts, no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform at a time: each build adds its entry to the release's latest.json, so they must not race.
      # The Mac build goes first, and a Windows or Linux failure never stops it.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            bundle: target/universal-apple-darwin/release/bundle
          - name: Windows
            runner: windows-latest
            rust-targets: ''
            args: --config src-tauri/tauri.release.conf.json
            bundle: target/release/bundle
          - name: Linux
            runner: ubuntu-22.04
            rust-targets: ''
            args: --config src-tauri/tauri.release.conf.json
            bundle: target/release/bundle
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Linux build libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Release notes from CHANGELOG.md
        id: notes
        if: github.event_name == 'push'
        shell: bash
        run: |
          {
            echo 'body<<SLAYBUDGET_NOTES'
            node scripts/ci-release-notes.ts body "${GITHUB_REF_NAME}"
            echo 'SLAYBUDGET_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (see RELEASE.md). Apple and Windows code signing can be added later.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a dry run: build only, no release.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: 'SlayBudget ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Signed updater files are only built here (the release config), so local builds need no key.
          args: ${{ matrix.args }}

      - name: Keep the installers (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SlayBudget-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  notes:
    # After every platform has added itself: put the full changelog in latest.json (the app shows what's new between
    # your version and the latest). Runs even if Windows or Linux failed, as long as the Mac build made latest.json.
    needs: build
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put the full changelog in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --dir release-assets --clobber
          node scripts/ci-release-notes.ts latest release-assets/latest.json
          gh release upload "${GITHUB_REF_NAME}" release-assets/latest.json --clobber
