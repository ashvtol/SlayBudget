name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'body<<SLAYBUDGET_NOTES'
            node scripts/ci-release-notes.ts body "${GITHUB_REF_NAME}"
            echo 'SLAYBUDGET_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (see RELEASE.md). Apple signing secrets can be added later for notarization.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SlayBudget ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Signed updater files are only built here (the release config), so local builds need no key.
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Put the full changelog in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --dir release-assets --clobber
          node scripts/ci-release-notes.ts latest release-assets/latest.json
          gh release upload "${GITHUB_REF_NAME}" release-assets/latest.json --clobber
